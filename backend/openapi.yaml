info:
  title: Tessera Control Plane API
  description: Hosted control-plane API for Tessera
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          example: Acme
      required:
        - name
    UpdateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          example: Acme
    CreateMembershipDto:
      type: object
      properties:
        subject:
          type: string
          description: Stable Auth0 subject identifier
        role:
          type: string
          enum:
            - owner
            - admin
            - viewer
      required:
        - subject
        - role
    UpdateMembershipDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - owner
            - admin
            - viewer
      required:
        - role
    RoutingConfigurationDto:
      type: object
      properties:
        pathPrefix:
          type: string
          example: /
      required:
        - pathPrefix
    RuntimeThresholdsDto:
      type: object
      properties:
        requestTimeoutMs:
          type: number
          minimum: 100
          maximum: 120000
        maxRequestBodyBytes:
          type: number
          minimum: 0
          maximum: 104857600
      required:
        - requestTimeoutMs
        - maxRequestBodyBytes
    TenantRuntimeConfigurationDto:
      type: object
      properties:
        upstreamUrl:
          type: string
          example: https://app.internal.example
        failureBehavior:
          type: string
          enum:
            - allow
            - block
        unknownEndpointBehavior:
          type: string
          enum:
            - allow
            - block
        routing:
          $ref: '#/components/schemas/RoutingConfigurationDto'
        thresholds:
          $ref: '#/components/schemas/RuntimeThresholdsDto'
        samplingRate:
          type: number
          minimum: 0
          maximum: 1
      required:
        - upstreamUrl
        - failureBehavior
        - unknownEndpointBehavior
        - routing
        - thresholds
        - samplingRate
    CreateTenantDto:
      type: object
      properties:
        name:
          type: string
          example: Checkout API
        slug:
          type: string
          example: checkout-api
        runtimeConfiguration:
          $ref: '#/components/schemas/TenantRuntimeConfigurationDto'
      required:
        - name
        - slug
        - runtimeConfiguration
    UpdateTenantDto:
      type: object
      properties:
        name:
          type: string
          example: Checkout API
        slug:
          type: string
          example: checkout-api
        runtimeConfiguration:
          $ref: '#/components/schemas/TenantRuntimeConfigurationDto'
    CreateApiKeyDto:
      type: object
      properties:
        name:
          type: string
          example: Production collector
        type:
          type: string
          enum:
            - collector
            - deployment
        scopes:
          type: array
          items:
            type: string
            enum:
              - analysis-uploads:write
              - bundles:read
              - heartbeats:write
              - telemetry:write
              - jev-credentials:read
        allowedTenantIds:
          type: array
          items:
            type: string
      required:
        - name
        - type
        - scopes
        - allowedTenantIds
    PolicyToolConfigDto:
      type: object
      properties:
        minLength:
          type: number
          minimum: 0
          maximum: 1000000
        maxLength:
          type: number
          minimum: 0
          maximum: 1000000
    PolicyToolDto:
      type: object
      properties:
        toolId:
          type: string
          example: string_length
        target:
          type: string
          example: body.username
        config:
          $ref: '#/components/schemas/PolicyToolConfigDto'
      required:
        - toolId
        - target
        - config
    EndpointPolicyDto:
      type: object
      properties:
        method:
          type: string
          enum:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
        path:
          type: string
          example: /users/:id
        tools:
          type: array
          items:
            $ref: '#/components/schemas/PolicyToolDto'
      required:
        - method
        - path
        - tools
    StructuredPolicyV1Dto:
      type: object
      properties:
        schemaVersion:
          type: string
          enum:
            - tessera.policy/v1
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/EndpointPolicyDto'
      required:
        - schemaVersion
        - endpoints
    ImportPolicyDto:
      type: object
      properties:
        humanReadableIntent:
          type: string
          maxLength: 10000
        structuredPolicy:
          $ref: '#/components/schemas/StructuredPolicyV1Dto'
      required:
        - humanReadableIntent
        - structuredPolicy
    RejectPolicyDto:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
        - reason
    HeartbeatTenantV1Dto:
      type: object
      properties:
        tenantId:
          type: string
        bundleSource:
          type: string
          enum:
            - remote
            - last_known_good
            - none
        loadedBundleVersion:
          type: string
          description: Required unless bundleSource is none
      required:
        - tenantId
        - bundleSource
    ProxyHeartbeatV1Dto:
      type: object
      properties:
        schemaVersion:
          type: string
          enum:
            - tessera.heartbeat/v1
        instanceId:
          type: string
          description: Random identifier of one proxy process
        proxyVersion:
          type: string
          example: 0.1.0
        supportedBundleSchemas:
          example:
            - tessera.bundle/v1
          type: array
          items:
            type: string
        supportedToolRegistries:
          example:
            - tessera.tools/v1
          type: array
          items:
            type: string
        health:
          type: string
          enum:
            - ok
            - degraded
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/HeartbeatTenantV1Dto'
      required:
        - schemaVersion
        - instanceId
        - proxyVersion
        - supportedBundleSchemas
        - supportedToolRegistries
        - health
        - tenants
    TelemetryDecisionCountsV1Dto:
      type: object
      properties:
        allow:
          type: number
          minimum: 0
        block:
          type: number
          minimum: 0
      required:
        - allow
        - block
    TelemetryStaticVerdictCountsV1Dto:
      type: object
      properties:
        safe:
          type: number
          minimum: 0
        suspicious:
          type: number
          minimum: 0
        policyViolation:
          type: number
          minimum: 0
        error:
          type: number
          minimum: 0
      required:
        - safe
        - suspicious
        - policyViolation
        - error
    TelemetryJevCountsV1Dto:
      type: object
      properties:
        sampledSafe:
          type: number
          minimum: 0
          description: SAFE requests selected by sampling
        attack:
          type: number
          minimum: 0
        benign:
          type: number
          minimum: 0
        unavailable:
          type: number
          minimum: 0
      required:
        - sampledSafe
        - attack
        - benign
        - unavailable
    TelemetryEndpointV1Dto:
      type: object
      properties:
        endpoint:
          type: string
          nullable: true
          example: POST /users/:id
          description: >-
            Policy endpoint key from the loaded bundle; null aggregates requests
            that matched no policy endpoint
        decisions:
          $ref: '#/components/schemas/TelemetryDecisionCountsV1Dto'
        staticVerdicts:
          $ref: '#/components/schemas/TelemetryStaticVerdictCountsV1Dto'
        jev:
          $ref: '#/components/schemas/TelemetryJevCountsV1Dto'
        failureBehaviorApplied:
          type: number
          minimum: 0
          description: Decisions taken by the tenant failure behavior
        samplingRate:
          type: object
          nullable: true
          minimum: 0
          maximum: 1
          description: Sampling rate in effect at the end of the window
        attackRateEwma:
          type: object
          nullable: true
          minimum: 0
          maximum: 1
          description: Endpoint attack-rate EWMA at the end of the window
      required:
        - endpoint
        - decisions
        - staticVerdicts
        - jev
        - failureBehaviorApplied
    TelemetryTenantEventsV1Dto:
      type: object
      properties:
        bundleVerificationFailures:
          type: number
          minimum: 0
        bundlePullFailures:
          type: number
          minimum: 0
        droppedWindows:
          type: number
          minimum: 0
          description: Earlier telemetry windows the proxy dropped
      required:
        - bundleVerificationFailures
        - bundlePullFailures
        - droppedWindows
    TelemetryWindowV1Dto:
      type: object
      properties:
        tenantId:
          type: string
        bundleVersion:
          type: string
          nullable: true
          description: Bundle loaded during the window; null when none is loaded
        windowStart:
          type: string
          example: '2026-10-03T12:34:00.000Z'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryEndpointV1Dto'
        events:
          $ref: '#/components/schemas/TelemetryTenantEventsV1Dto'
        attackRateEwma:
          type: object
          nullable: true
          minimum: 0
          maximum: 1
          description: Tenant attack-rate EWMA at the end of the window
      required:
        - tenantId
        - bundleVersion
        - windowStart
        - endpoints
        - events
    TelemetryBatchV1Dto:
      type: object
      properties:
        schemaVersion:
          type: string
          enum:
            - tessera.telemetry/v1
        instanceId:
          type: string
          description: Same instance id as in heartbeats
        batchId:
          type: string
          description: Random per batch; retries reuse it
        windows:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryWindowV1Dto'
      required:
        - schemaVersion
        - instanceId
        - batchId
        - windows
    AlertSettingsDto:
      type: object
      properties:
        attackRateThreshold:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: >-
            Open an attack-rate alert when the last hour exceeds this ATTACK
            share of JEV-classified requests. null disables it; there is no
            default.
        attackRateMinClassified:
          type: number
          nullable: true
          minimum: 1
          description: >-
            Minimum JEV-classified requests in the last hour before the
            threshold applies. Required with attackRateThreshold.
      required:
        - attackRateThreshold
        - attackRateMinClassified
    LinkGitHubInstallationDto:
      type: object
      properties:
        installationId:
          type: number
          description: installation_id from the GitHub App setup callback
        code:
          type: string
          description: OAuth code from the GitHub App setup callback
      required:
        - installationId
        - code
    BindRepositoryDto:
      type: object
      properties:
        installationId:
          type: number
        owner:
          type: string
          example: acme
        name:
          type: string
          example: checkout-api
      required:
        - installationId
        - owner
        - name
    PutJevCredentialDto:
      type: object
      properties:
        apiKey:
          type: string
          description: >-
            JEV API key. Write-only: it is encrypted at rest, never returned to
            the dashboard, and delivered only to deployment keys with
            jev-credentials:read.
          writeOnly: true
      required:
        - apiKey
    SourceRevisionV1Dto:
      type: object
      properties:
        commitSha:
          type: string
          description: Full 40-character Git commit SHA
      required:
        - commitSha
    CollectorInfoV1Dto:
      type: object
      properties:
        name:
          type: string
          example: tessera-collector
        version:
          type: string
          example: 0.1.0
      required:
        - name
        - version
    EnvironmentToolRunV1Dto:
      type: object
      properties:
        name:
          type: string
          example: syft
        version:
          type: string
          example: 1.20.0
        status:
          type: string
          enum:
            - succeeded
            - failed
        error:
          type: string
          maxLength: 500
      required:
        - name
        - version
        - status
    DependencyV1Dto:
      type: object
      properties:
        name:
          type: string
          example: express
        version:
          type: string
          example: 4.21.2
        ecosystem:
          type: string
          example: npm
        purl:
          type: string
          example: pkg:npm/express@4.21.2
        source:
          type: string
          example: syft
          description: Tool that reported it
      required:
        - name
        - version
        - ecosystem
        - source
    VulnerabilityV1Dto:
      type: object
      properties:
        id:
          type: string
          example: CVE-2024-45590
        packageName:
          type: string
          example: body-parser
        installedVersion:
          type: string
          example: 1.20.2
        fixedVersion:
          type: string
          example: 1.20.3
        severity:
          type: string
          enum:
            - unknown
            - low
            - medium
            - high
            - critical
        source:
          type: string
          example: trivy
          description: Tool that reported it
      required:
        - id
        - packageName
        - installedVersion
        - severity
        - source
    EnvironmentContextV1Dto:
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentToolRunV1Dto'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyV1Dto'
        vulnerabilities:
          type: array
          items:
            $ref: '#/components/schemas/VulnerabilityV1Dto'
      required:
        - tools
        - dependencies
        - vulnerabilities
    CollectorRedactionManifestV1Dto:
      type: object
      properties:
        tool:
          type: string
          example: tessera-redactor
        rules:
          example:
            - env-values
          type: array
          items:
            type: string
        redactedValueCount:
          type: number
          minimum: 0
      required:
        - tool
        - rules
        - redactedValueCount
    AnalysisUploadV1Dto:
      type: object
      properties:
        schemaVersion:
          type: string
          enum:
            - tessera.analysis-upload/v1
        sourceRevision:
          $ref: '#/components/schemas/SourceRevisionV1Dto'
        collector:
          $ref: '#/components/schemas/CollectorInfoV1Dto'
        environment:
          $ref: '#/components/schemas/EnvironmentContextV1Dto'
        redaction:
          $ref: '#/components/schemas/CollectorRedactionManifestV1Dto'
      required:
        - schemaVersion
        - sourceRevision
        - collector
        - environment
        - redaction
    GeneratePolicyDto:
      type: object
      properties:
        analysisId:
          type: string
          description: Completed or partial analysis of this project
      required:
        - analysisId
    EditPolicyDto:
      type: object
      properties:
        instruction:
          type: string
          maxLength: 2000
          description: >-
            Natural-language change to the base version. The result is a new
            version that must be reviewed; see precisionWarning.
      required:
        - instruction
